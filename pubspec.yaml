name: flux_ui
description: "The Basic and Dynamic Layout Widgets for FluxBuilder (Mobile E-commerce App) - https://fluxbuilder.com"
version: 0.0.2
homepage: https://fluxbuilder.com

environment:
  sdk: ^3.5.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

  inspireui:
    git:
      url: https://github.com/MohamedMahmoud10/inspireui
      ref: master

  intl: ^0.19.0
  quiver: 3.2.2
  responsive_builder: 0.7.1
  universal_platform: ^1.1.0
  lottie: ^3.1.2
  extended_image: 9.0.7
  share_plus: 10.1.1
  flutter_svg: ^2.0.13
  animated_text_kit: ^4.2.2
  html: ^0.15.4
  url_launcher: 6.3.0
  collection: ^1.18.0
  freezed_annotation: 2.4.4
  html_unescape: 2.0.0
  visibility_detector: 0.4.0+2
  smooth_page_indicator: 1.2.0+3
  carousel_slider_plus: 7.0.1

    # HTML render
  flutter_widget_from_html_core: ^0.15.2
  fwfh_svg: 0.8.3
  fwfh_cached_network_image: 0.14.3
  fwfh_url_launcher: 0.9.1
  fwfh_chewie: 0.14.8
  fwfh_webview: 0.15.2
  google_fonts: ^6.2.1
  build_runner: ^2.4.13
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.4
  bloc_test: ^9.1.7
  test: ^1.25.7
  freezed: 2.5.3
  json_serializable: ^6.8.0

